<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/icon-512.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600&display=swap"
      rel="stylesheet"
    />
    <title>TuCampus</title>

    <!-- 🌐 SEO / OpenGraph — dominio propio oficial.
         Se usa el subdominio www (https://www.tucampus.net.pe/) como
         canónico: es el destino final al que vercel.json redirige de
         forma permanente (308) todo el tráfico del dominio viejo
         (unp-market-react.vercel.app). Mantener este canonical alineado
         con ese destino evita que buscadores indexen una URL que luego
         termina redirigiendo a otra. -->
    <link rel="canonical" href="https://www.tucampus.net.pe/" />
    <meta name="description" content="TuCampus — el marketplace de tu universidad. Compra y vende entre estudiantes de tu campus." />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TuCampus" />
    <meta property="og:title" content="TuCampus" />
    <meta property="og:description" content="El marketplace de tu universidad. Compra y vende entre estudiantes de tu campus." />
    <meta property="og:url" content="https://www.tucampus.net.pe/" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="TuCampus" />
    <meta name="twitter:description" content="El marketplace de tu universidad. Compra y vende entre estudiantes de tu campus." />

    <!-- 📱 PWA — instalabilidad -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0639B8" />

    <!-- Chrome/Android (estándar moderno) + fallback Safari/iOS -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TuCampus" />
    <link rel="apple-touch-icon" href="/assets/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
